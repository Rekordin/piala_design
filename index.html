#app{display:grid;grid-template-columns:230px 1fr 340px;height:100%}
aside,section{overflow:auto;padding:16px;background:var(--pn);box-sizing:border-box}

aside #tl button{display:block;width:100%;text-align:left;margin-bottom:6px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#th button.on{outline:4px solid var(--ac);border-color:var(--ln)}
.row{display:flex;gap:6px;flex-wrap:wrap}
label{display:block;font-size:12px;font-weight:800;margin-top:10px}
label>*{display:block;width:100%;box-sizing:border-box;margin-top:4px}
.g{font:800 12px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:16px 0 8px;opacity:.75}
h2{font:400 18px "Rubik Mono One",sans-serif;text-transform:uppercase;margin:0 0 8px;color:var(--ac)}
.pri{width:100%;background:var(--ac);color:#fff;border-color:var(--ac);margin-top:10px;padding:14px;font-size:16px}
.li{display:flex;gap:8px;align-items:center;margin-top:6px}.li img{width:36px;height:36px;object-fit:contain;border:2px solid var(--ln)}.li span{flex:1;font-size:13px;min-width:0;overflow:hidden}.li button{padding:4px 8px;font-size:12px}
#hd{flex:none;background:conic-gradient(#c9c5bb 25%,#e6e2d8 0 50%,#c9c5bb 0 75%,#e6e2d8 0) 0 0/24px 24px}
#wr{transform-origin:0 0}
.st{box-sizing:border-box;padding:56px;display:flex;flex-direction:column;gap:32px;overflow:hidden;position:relative;font-family:Inter,sans-serif;font-weight:500}
.d{font-family:"Rubik Mono One",sans-serif;font-weight:400;text-transform:uppercase;line-height:1;white-space:nowrap;margin:0}
.tb{font:800 22px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;border-bottom:10px solid;padding-bottom:16px}

return frameOv([[g,t,gw,gh],[cx,t,rw,ch],[cx,t+ch+g,rw,gh-ch-g]],ab(g,0,W-2*g,t,'display:flex;align-items:center;justify-content:space-between',lab(S.g.l,'font-size:30px')+lab(S.g.r,'font-size:30px;color:'+C.a))+plate(cx+14,t+ch-64,v.p1)+plate(cx+14,H-b-g-64,v.p2)+ab(g,H-b,W-2*g,b,'display:flex;align-items:center;justify-content:space-between;gap:28px',lab(v.tt,'font-size:30px')+`<div style="display:flex;align-items:center;gap:16px;background:${C.a};color:${C.bg};padding:12px 28px">${D(64,v.s1)}${D(30,':')}${D(64,v.s2)}</div>`+lab(v.rd,'font-size:30px')))}
const tp=110,bt=190,hw=Math.round((W-2*g-g)/2),hh=H-tp-bt;
return frameOv([[g,tp,hw,hh],[g+hw+g,tp,hw,hh]],ab(g,0,W-2*g,tp,'display:flex;align-items:center;justify-content:space-between',D(FT(v.tt,W*.6,56),v.tt)+lg(v.lg1,80))+ab(g,tp+hh,hw,bt,'display:flex;flex-direction:column;justify-content:center;gap:10px',D(FT(v.cn,hw,64),v.cn)+lab(v.cr,'color:'+C.a))+ab(g+hw+g,tp+hh,hw,bt,'display:flex;flex-direction:column;justify-content:center;gap:10px',D(FT(v.p1,hw,64),v.p1)+lab('Игрок','color:'+C.a)))}};
const S={t:'match',sz:'4:5',th:'paper',g:{l:'Пиала Cup · Drafts II',r:'EA FC 27'},v:{}};
for(const k in T)S.v[k]=Object.fromEntries(T[k].f.map(f=>[f[0],f[2]]));
const stage=$('#stage'),wr=$('#wr'),hd=$('#hd'),pv=$('#pv');
function fit(){const k=Math.min((pv.clientWidth-32)/W,(pv.clientHeight>200&&getComputedStyle(pv).overflow!='visible'?(pv.clientHeight-32)/H:9));wr.style.transform=`scale(${k})`;hd.style.width=W*k+'px';hd.style.height=H*k+'px'}
function draw(){const[w,h]=SZ[S.sz];W=w;H=h;L=w>h;tight=!L&&h<=1350;C=TH[S.th];const t=T[S.t],v=S.v[S.t];stage.style.width=w+'px';stage.style.height=h+'px';stage.style.background=t.tr&&t.tr(v)?'transparent':C.bg;stage.style.color=C.fg;try{stage.innerHTML=t.r(v)}catch(x){stage.textContent='Ошибка: '+x.message}$('#px').textContent=Math.round(w*$('#sc').value)+' × '+Math.round(h*$('#sc').value)+' px';fit()}
function panel(){const t=T[S.t],v=S.v[S.t];const fld=(a,g)=>{const[k,l,,ty,o]=a,val=g?S.g[k]:v[k],d=g?'data-g="1" ':'';let c;
if(ty=='a')c=`<textarea ${d}data-k="${k}" rows="${Math.min(11,String(val).split('\n').length+1)}">${e(val)}</textarea>`;
else if(ty=='s')c=`<select ${d}data-k="${k}">${o.map((x,i)=>`<option value="${i}" ${val==i?'selected':''}>${x}</option>`).join('')}</select>`;
else if(ty=='logo'||ty=='photo'){const op=i=>`<option value="${e(i.url)}" ${val==i.url?'selected':''}>${e(i.name)}</option>`,gr=(t,k2)=>{const a=lib.filter(i=>KD(i)==k2);return a.length?`<optgroup label="${t}">${a.map(op).join('')}</optgroup>`:''};c=`<select data-k="${k}"><option value="">— нет —</option>${ty=='logo'?gr('Логотипы участников','logo'):gr('Фото вертикальные','pv')+gr('Фото квадратные','pq')}</select>`}
else c=`<input ${d}data-k="${k}" value="${e(val)}">`;return `<label>${l}${c}</label>`};
$('#pn').innerHTML=`<div class="g">${t.n}</div>`+t.f.map(a=>fld(a)).join('')+`<div class="g">Верхняя строка</div>`+fld(['l','Слева'],1)+fld(['r','Справа'],1)}
function ui(){$('#tl').innerHTML=Object.entries(T).map(([k,t])=>`<button data-t="${k}" class="${k==S.t?'on':''}">${t.n}</button>`).join('');
$('#sz').innerHTML=Object.keys(SZ).map(k=>`<button data-s="${k}" class="${k==S.sz?'on':''}">${k}</button>`).join('');
$('#th').innerHTML=Object.entries(TH).map(([k,t])=>`<button data-h="${k}" class="${k==S.th?'on':''}" style="background:${t.bg};color:${t.fg}">${t.n}</button>`).join('');
const TB=[['logo','Логотипы участников'],['pv','Фото участников: вертикальные'],['pq','Фото участников: квадратные']];
$('#lt').innerHTML=TB.map(([k,n])=>`<button data-tab="${k}" class="${k==UK?'on':''}">${n.split(': ').pop()} (${lib.filter(i=>KD(i)==k).length})</button>`).join('');
$('#bu').textContent='+ Загрузить: '+TB.find(x=>x[0]==UK)[1];
$('#lb').innerHTML=lib.filter(i=>KD(i)==UK).map(i=>`<div class="li"><img src="${e(i.url)}" alt=""><span>${e(i.name)}</span><button data-use="${e(i.id)}">Взять</button><button data-del="${e(i.id)}">×</button></div>`).join('')||'<div style="font-size:13px;margin-top:6px;opacity:.7">Во вкладке пока пусто. Загрузите файлы кнопкой выше.</div>';
panel();draw()}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
if(d.t){S.t=d.t;if(S.t=='ov')S.sz='16:9';ui()}else if(d.s){S.sz=d.s;ui()}else if(d.h){S.th=d.h;ui()}else if(d.del)delItem(d.del);else if(d.tab){UK=d.tab;ui()}else if(d.use){useItem(d.use)}else if(b.id=='bu'){$('#fl').click()}else if(b.id=='be'){libExp()}else if(b.id=='bi'){$('#fi').click()}else if(b.id=='ex')exp()});
$('#pn').addEventListener('input',ev=>{const k=ev.target.dataset.k;if(k==null)return;(ev.target.dataset.g?S.g:S.v[S.t])[k]=ev.target.value;draw()});
$('#sc').addEventListener('change',draw);window.addEventListener('resize',fit);
$('#fl').addEventListener('change',async ev=>{for(const f of ev.target.files)await up(UK,f);ev.target.value=''});
$('#fi').addEventListener('change',async ev=>{try{await libImp(ev.target.files[0])}catch(x){$('#msg').textContent='Не удалось импортировать файл'}ev.target.value=''});
const U=async n=>{try{return await window.claude.use(n)}catch(x){return null}};
async function up(kind,f){let url;if(as){try{url=(await as.upload(f)).url}catch(x){}}
const it={name:f.name.replace(/\.[^.]+$/,''),kind,url:url||URL.createObjectURL(f)};
if(db&&url){try{await db.collection('lib').add(it);return}catch(x){}}const id='loc'+Date.now()+Math.random();lib.push({id,loc:1,...it});idbPut({id,name:it.name,kind,blob:f});ui()}
async function delItem(id){const it=lib.find(x=>x.id==id);if(!it)return;if(it.loc){lib=lib.filter(x=>x!==it);idbDel(id);ui()}else if(db){try{await db.collection('lib').doc(id).delete()}catch(x){}}}
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('piala-lib',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbOp=async(m,v)=>{try{const d=await idb();return await new Promise((ok,no)=>{const st=d.transaction('items',m=='get'?'readonly':'readwrite').objectStore('items'),q=m=='get'?st.getAll():m=='put'?st.put(v):st.delete(v);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(x){return m=='get'?[]:null}};
const idbAll=()=>idbOp('get'),idbPut=v=>idbOp('put',v),idbDel=id=>idbOp('del',id);
const rd=b=>new Promise(o=>{const f=new FileReader();f.onload=()=>o(f.result);f.readAsDataURL(b)});
async function libExp(){try{const out=[];for(const i of lib){try{out.push({name:i.name,kind:KD(i),data:await rd(await (await fetch(i.url)).blob())})}catch(x){}}await dl.save({filename:'piala-library.json',data:new Blob([JSON.stringify(out)],{type:'application/json'})})}catch(x){$('#msg').textContent=x&&x.code=='declined'?'Сохранение отменено':'Не удалось экспортировать'}}
async function libImp(f){const a=JSON.parse(await f.text());for(const r of a){const b=await (await fetch(r.data)).blob();await up(r.kind,new File([b],r.name+'.'+(b.type.split('/')[1]||'png'),{type:b.type}))}$('#msg').textContent='Импортировано: '+a.length}
function useItem(id){const it=lib.find(x=>x.id==id);if(!it)return;const ty=KD(it)=='logo'?'logo':'photo',v=S.v[S.t],fs=T[S.t].f.filter(f=>f[3]==ty),f=fs.find(f=>!v[f[0]])||fs[0];if(!f){$('#msg').textContent='В этом макете нет места под '+(ty=='logo'?'логотип':'фото');return}$('#msg').textContent='';v[f[0]]=it.url;ui()}
async function inl(){const im=[...stage.querySelectorAll('img')],M={};for(const i of im){const k=i.src;try{if(!M[k]){const b=await (await fetch(k)).blob();M[k]=await new Promise(o=>{const f=new FileReader();f.onload=()=>o(f.result);f.readAsDataURL(b)})}i.src=M[k]}catch(x){}}await Promise.all(im.map(i=>i.decode().catch(()=>{})))}
async function exp(){const bt=$('#ex');if(!dl||!window.html2canvas)return;bt.disabled=true;bt.textContent='Готовлю…';$('#msg').textContent='';
try{await document.fonts.ready;wr.style.transform='none';await inl();const fm=$('#fm').value,sc=+$('#sc').value;const cv=await html2canvas(stage,{scale:sc,backgroundColor:fm=='jpg'?C.bg:null,useCORS:true,logging:false});
const bl=await new Promise(r=>cv.toBlob(r,fm=='jpg'?'image/jpeg':'image/png',.95));await dl.save({filename:`piala-${S.t}-${S.sz.replace(':','x')}.${fm}`,data:bl})}
catch(x){$('#msg').textContent=x&&x.code=='declined'?'Сохранение отменено':'Не удалось сохранить: '+((x&&(x.message||x.code))||x)}
bt.disabled=false;bt.textContent='Скачать';draw()}
ui();fetch(LOGO).then(r=>r.blob()).then(b=>{LOGOU=URL.createObjectURL(b);draw()}).catch(()=>{});
(async()=>{dl=await U('downloads');as=await U('assets');db=await U('db');try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}idbAll().then(a=>{lib=lib.concat(a.map(r=>({id:r.id,name:r.name,kind:r.kind,url:URL.createObjectURL(r.blob),loc:1})));ui()});$('#ln').textContent=(db&&as)?'Файлы сохраняются на странице и доступны при каждом входе.':'Файлы хранятся в этом браузере. Для переноса на другое устройство используйте экспорт и импорт.';
if(!dl)dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
if(db){try{db.collection('lib').onSnapshot(s=>{lib=lib.filter(x=>x.loc).concat(s.docs.map(d=>({id:d.id,...d.data()})));ui()})}catch(x){}}})();
